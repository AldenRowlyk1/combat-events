name: Combat Robotics Event Tracker

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * *"

permissions:
  contents: write

jobs:
  check-events:
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      RADIUS_MILES: "450"
      MAJOR_EVENT_RADIUS_MILES: "1100"
      POST_NO_EVENT_MESSAGE: "false"
      FORCE_SUMMARY: "false"
      ROLE_MENTION: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Python packages
        run: pip install -r requirements.txt
      - name: Run event tracker
        run: python event_tracker.py
      - name: Save tracking history and source health
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tracker_state.json latest_events.json source_status.json
          git diff --cached --quiet && exit 0
          git commit -m "Update event tracker history and source health"
          git push
